[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmarket-data-platform"
version = "0.1.0"
description = "Data engineering platform for job market analytics"
requires-python = ">=3.11"

dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dashboard = [
    "altair>=5.0",
    "streamlit>=1.35",
]
pipeline = [
    "azure-storage-file-datalake>=12.14",
    "pyarrow>=15.0",
    "pyspark==4.0.1",
]
dev = [
    "pytest>=8.2",
]
windows = [
    "jdk4py==21.0.8.2",
]
all = [
    "altair>=5.0",
    "azure-storage-file-datalake>=12.14",
    "fastapi>=0.111",
    "pyarrow>=15.0",
    "pyspark==4.0.1",
    "streamlit>=1.35",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
